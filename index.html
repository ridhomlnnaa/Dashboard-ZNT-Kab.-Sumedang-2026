<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard ZNT Kab. Sumedang 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f1;--surface:#fff;--ink:#1c2a2b;--muted:#5c6b6c;--line:#dde1dc;--accent:#0f5c5e;--accent-ink:#fff;--good:#1f7a4d;--warn:#b07400;--bad:#b3362f;--rsd:#8e3b8f;--none:#8a9694;--chip:#e6ece9;
--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--hh:56px}
@media (prefers-color-scheme:dark){:root{--bg:#121819;--surface:#1a2223;--ink:#e4ebe9;--muted:#93a3a2;--line:#2b3637;--accent:#5fc2bd;--accent-ink:#0b1415;--good:#59c28d;--warn:#e0a63d;--bad:#ef7a72;--rsd:#c78bc9;--none:#6f7f7d;--chip:#243030;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000}
.hin{max-width:1600px;margin:0 auto;min-height:var(--hh);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:8px}
h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px}
.hbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font:inherit;font-size:13px;font-weight:500;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:inline-flex}.seg .btn{border-radius:0;margin-left:-1px}.seg .btn:first-child{border-radius:6px 0 0 6px;margin:0}.seg .btn:last-child{border-radius:0 6px 6px 0}
.btn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible,tr[data-z]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{max-width:1600px;margin:0 auto;padding-block:14px;display:grid;grid-template-columns:minmax(320px,410px) minmax(0,1fr);gap:14px;align-items:start}
body.v-peta .side,body.v-peta .rekap{display:none}body.v-peta .main{grid-template-columns:1fr}
body.v-data .mapcol{display:none}body.v-data .main{grid-template-columns:1fr}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.card h2{font-size:12px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=search],input[type=number]{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.big{font-family:var(--mono);font-size:30px;font-weight:500;line-height:1}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-block:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-top:10px}
.stat{border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.stat b{display:block;font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chipb{font:inherit;font-size:12px;background:var(--chip);color:var(--ink);border:1px solid transparent;border-radius:999px;padding:3px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chipb.on{border-color:var(--accent);font-weight:600}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.mapcol{min-width:0;position:sticky;top:calc(var(--hh) + 8px)}
.mtool{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--muted)}
.mrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}.mt{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-right:2px}
.mf{display:flex;flex-direction:column;gap:3px;min-width:200px;flex:1}.mf span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}.mf select{width:100%}
.lchip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;color:var(--ink);background:var(--chip);font-size:12.5px}.lchip:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}.lchip .swatch{width:14px;margin:0}
#map{height:calc(100vh - var(--hh) - 190px);min-height:420px;border:1px solid var(--line);border-radius:8px;background:var(--chip);z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.scroll{overflow-x:auto;max-height:520px;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--chip);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);z-index:1}
td.n,th.n{text-align:right}
tr[data-z]{cursor:pointer}tr[data-z]:hover td{background:var(--chip)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.rsd{color:var(--rsd);background:color-mix(in srgb,var(--rsd) 14%,transparent)}
.pill.none{color:var(--muted);background:var(--chip)}
.rekap{max-width:1600px;margin:0 auto;padding-bottom:40px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{font:inherit;background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:14px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.tools p{margin:0;color:var(--muted);font-size:13px;flex:1 1 260px;min-width:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.log{display:flex;flex-direction:column;max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
.log div{padding:6px 10px;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.log div:last-child{border:0}.log div:hover{background:var(--chip)}
.log span{color:var(--muted);white-space:nowrap}
svg.chart text{fill:var(--muted);font-size:9px;font-family:var(--mono)}
svg.chart line{stroke:var(--line)}
.leaflet-popup-content{font-family:var(--sans);font-size:12.5px;margin:10px 12px}
.leaflet-popup-content table{font-size:12px}.leaflet-popup-content th,.leaflet-popup-content td{padding:3px 6px}
.leaflet-container{font-family:var(--sans)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.pop{min-width:270px}.ph{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:8px;font-size:14px}.pbar{width:4px;height:18px;border-radius:2px}
.pr{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:12.5px}.pr span{color:var(--muted)}.pr b{font-weight:500;text-align:right}
.pq{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}.pt{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent);margin-bottom:2px}
details summary{cursor:pointer;color:var(--accent);font-size:12.5px;margin-top:6px}
.swatch{display:inline-block;width:16px;height:0;border-top:3px solid var(--c);vertical-align:middle;margin-right:2px}
.sync .row{margin-top:8px}.sync .btn{flex:1 1 130px}.sdot{width:9px;height:9px;border-radius:50%;background:var(--good);display:inline-block}
.sync.busy .sdot{background:var(--warn)}.sync.err .sdot{background:var(--bad)}
.hint{border:1px dashed var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.hint ol{margin:8px 0 8px 18px;padding:0}.hint li{margin:3px 0}
.mg{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px 10px;align-items:start;margin-top:8px;font-size:12.5px}.mg>label{color:var(--muted);padding-top:6px}.mg select{width:100%}
code{font-family:var(--mono);font-size:11.5px;background:var(--chip);padding:1px 5px;border-radius:4px}
#fileInput{display:none}
@media (max-width:900px){.main{grid-template-columns:1fr}.mapcol{position:static;order:-1}#map{height:60vh;min-height:340px}}
</style>
</head>
<body class="v-split">
<header class="gut"><div class="hin">
 <div><h1>Dashboard ZNT Kab. Sumedang 2026</h1><div class="sub" id="stamp">Belum ada data dimuat</div></div>
 <div class="hbtns">
  <div class="seg" role="group" aria-label="Tampilan"><button class="btn ghost on" data-v="split">Peta + Data</button><button class="btn ghost" data-v="peta">Peta</button><button class="btn ghost" data-v="data">Data</button></div>
  <button class="btn ghost" id="pick">Muat file (.zip / .dbf)</button><input type="file" id="fileInput" accept=".zip,.dbf" multiple>
 </div>
</div></header>

<div class="main gut">
 <aside class="side" id="side"></aside>
 <section class="mapcol">
  <div class="mtool">
   <div class="mrow"><div class="mf"><span>Warnai zona berdasarkan</span><select id="mmode"><option value="nilai">Nilai tanah (8 kelas)</option><option value="delta">Perubahan nilai vs ZNT 2023</option><option value="rsd">Standar deviasi (RSD)</option><option value="jml">Sebaran sampel (jumlah titik)</option><option value="svy">Per surveyor</option><option value="cap">Capaian zona</option><option value="qc">Kualitas data</option></select></div><div class="mf"><span>Label di zona</span><select id="mlab"><option value="none">Tanpa label</option><option value="zona">Nomor zona</option><option value="rata">Rata-rata nilai (Rp ribu)</option><option value="n">Jumlah titik</option><option value="rsd">RSD (%)</option><option value="delta">Perubahan vs 2023 (%)</option></select></div></div>
   <div class="mrow"><span class="mt">Lapisan</span>
    <label class="lchip"><input type="checkbox" id="mzon" checked><i class="swatch" style="--c:#2a9d8f"></i>Zona</label>
    <label class="lchip"><input type="checkbox" id="mpts" checked><i class="swatch" style="--c:#999"></i>Titik sampel</label>
    <label class="lchip"><input type="checkbox" id="z23"><i class="swatch" style="--c:#8e44ad"></i>ZNT 2023</label>
    <label class="lchip" id="z23o" style="display:none">Transparansi <input type="range" id="z23r" min="15" max="95" value="60" style="width:80px"></label>
    <label class="lchip"><input type="checkbox" id="bkec"><i class="swatch" style="--c:#111"></i>Kecamatan</label>
    <label class="lchip"><input type="checkbox" id="bdesa"><i class="swatch" style="--c:#777"></i>Desa</label>
    <label class="lchip"><input type="checkbox" id="aoiA"><i class="swatch" style="--c:#e11d48"></i>AOI awal</label>
    <label class="lchip"><input type="checkbox" id="aoiB"><i class="swatch" style="--c:#0ea5e9"></i>AOI baru</label>
    <button class="btn ghost" id="aoiZ" style="padding:4px 10px;font-size:12px">Zoom ke AOI</button></div>
  </div>
  <div id="map"></div>
  <div class="legend" id="legend"></div>
 </section>
</div>

<section class="rekap gut" id="rekap"></section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/shpjs@6.1.0/dist/shp.min.js"></script>
<script>
(function(){
'use strict';
/* =====================================================================
   KONFIGURASI. Nama kolom TIDAK perlu diisi di sini: dideteksi otomatis dan
   bisa diubah lewat panel "Pemeriksaan data & kolom" di halaman.
   ===================================================================== */
const CFG={
  KAB:/sumedang/i,        // filter kolom kabupaten (bila ada). Isi null untuk tidak memfilter
  RSD_MAX:30,             // batas RSD (%) untuk status Valid
  MIN_TITIK:3,            // minimal titik agar RSD dianggap sah
  TARGET:ha=>ha<=900?3:ha<=1250?4:5,   // target titik per zona menurut luas (ha)
  Z23:{nilai:['NILAI','Nilai','RATA_RATA','HARGA','NILAI_ZNT','Nilai_ZNT'],guna:['PENGGUNAAN','Penggunaan','JENIS','GUNA']},
  KEC:{nama:['WADMKC','Kecamatan','KECAMATAN','NAMOBJ','nama','NAMA']},
  DESA:{nama:['WADMKD','Kelurahan','Desa','DESA','NAMOBJ','nama','NAMA']}
};
/* Aturan deteksi kolom: names = nama persis (tidak peka huruf besar-kecil), re = pola cadangan, num = harus berisi angka */
const SPEC={
 pt:{
  zona:{l:'Nomor zona',names:['HISTZONE','NO_ZONA','NOMOR_ZONA','NOZONA','ZONA','KODE_ZONA','ID_ZONA','ZNT'],re:/zona|zone|znt/i},
  nilai:{l:'Nilai tanah (Rp/m²)',num:1,names:['Nilai_Ta_1','NILAI_TANAH','NILAI','HARGA','HARGA_M2'],re:/nilai_?ta|nilai.*tanah|harga|nilai/i},
  svy:{l:'Surveyor',names:['Nama_Surve','SURVEYOR','PETUGAS'],re:/surve|petugas|enumerator/i},
  jenis:{l:'Jenis data',names:['Jenis_Data'],re:/jenis_?data|jenis_?sampel|sumber_?data/i},
  tp:{l:'Tgl pelaksanaan',names:['Tanggal_Pe'],re:/tanggal_?pe|tgl_?pel|pelaksana|tgl_?survei/i},
  tt:{l:'Tgl transaksi',names:['Tanggal__1'],re:/tanggal__1|tanggal.*tran|tgl.*tran|transaksi/i},
  kec:{l:'Kecamatan',names:['Kecamatan','KECAMATAN','WADMKC'],re:/kecamatan|^kec$|wadmkc/i},
  desa:{l:'Desa/kelurahan',names:['Kelurahan','Desa','WADMKD'],re:/kelurahan|desa|^kel$|wadmkd/i},
  x:{l:'Koordinat X (bujur)',num:1,names:['X','LONGITUDE','LONG','LON','BUJUR'],re:/^(x|lon|long|longitude)$/i},
  y:{l:'Koordinat Y (lintang)',num:1,names:['Y','LATITUDE','LAT','LINTANG'],re:/^(y|lat|latitude)$/i},
  luasT:{l:'Luas tanah (m²)',num:1,names:['Luas_tanah','LUAS_TANAH'],re:/luas.*tanah|luas_?t$/i},
  jalan:{l:'Kelas jalan',names:['Kelas_Jala'],re:/kelas_?jal|jalan/i},
  akses:{l:'Aksesibilitas',names:['Aksesibili'],re:/akses/i},
  jns:{l:'Peruntukan',names:['Jenis'],re:/^jenis$|peruntukan/i},
  no:{l:'Nomor sampel',num:1,names:['Nomor_Samp','NO_SAMPEL','NOMOR_SAMPEL','NO_SAMPLE'],re:/^no(mor)?_?samp|sampel/i},
  kab:{l:'Kabupaten',names:['WADMKK','KABUPATEN','KAB_KOTA'],re:/wadmkk|kabupaten|^kab/i}
 },
 zn:{
  zona:{l:'Nomor zona',names:['HISTZONE','NO_ZONA','NOMOR_ZONA','NOZONA','ZONA','KODE_ZONA','ID_ZONA','ZNT'],re:/zona|zone|znt/i},
  guna:{l:'Penggunaan (Pertanian/Non)',names:['PENGGUNAAN','Penggunaan','PERUNTUKAN'],re:/penggunaan|peruntukan|guna/i},
  luas:{l:'Luas zona',num:1,names:['Luas_M2','LUAS_M2','LUAS','LUAS_HA','Shape_Area','SHAPE_AREA'],re:/luas|area/i},
  n:{l:'Jumlah titik',num:1,names:['Jml_Titik','JML_TITIK'],re:/jml_?titik|jumlah_?titik|n_?titik|^n$/i},
  rsd:{l:'RSD (%)',num:1,names:['RSD_Persen'],re:/rsd/i},
  svy:{l:'Surveyor',names:['Surveyor'],re:/surve|petugas/i},
  rata:{l:'Rata-rata nilai (opsional)',num:1,names:[],re:/^rata|rata_?rata|^avg|^mean/i},
  kab:{l:'Kabupaten',names:['WADMKK','KABUPATEN','KAB_KOTA'],re:/wadmkk|kabupaten|^kab/i}
 }
};
/* ===================================================================== */

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(x,d=0)=>x==null||isNaN(x)?'':x.toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const UNK='(belum ditentukan)';
const SVY_COL=['#2f7fb8','#d0802c','#7a5aa6','#3a9b6a','#b8465a'];
const CLS8=['#1a9850','#66bd63','#a6d96a','#d9ef8b','#fee08b','#fdae61','#f46d43','#d73027'];
const DLT_CLS=[['turun lebih dari 30%',x=>x<-30,'#1a9850'],['turun 10 - 30%',x=>x<-10,'#a6d96a'],['relatif sama (-10 s/d +10%)',x=>x<=10,'#e0e0e0'],['naik 10 - 30%',x=>x<=30,'#fdae61'],['naik 30 - 60%',x=>x<=60,'#f46d43'],['naik lebih dari 60%',x=>true,'#a50026']];
const RSD_CLS=[['≤ 15%',x=>x<=15,'#1a9850'],['15 - 30%',x=>x<=30,'#a6d96a'],['30 - 50%',x=>x<=50,'#fee08b'],['50 - 100%',x=>x<=100,'#f46d43'],['> 100%',x=>true,'#a50026']];
const JML_CLS=[['0 titik',n=>n===0,'#cfd8dc'],['1 - 2',n=>n<=2,'#c6dbef'],['3',n=>n===3,'#9ecae1'],['4 - 5',n=>n<=5,'#6baed6'],['6 - 9',n=>n<=9,'#3182bd'],['10 atau lebih',n=>true,'#08519c']];
const CAP_COL={Selesai:'--good',Proses:'--warn',Belum:'--bad'},QC_COL={Valid:'--good',Revisi:'--rsd',Kurang:'--warn',Belum:'--none'};

/* ---------- data mentah ---------- */
let DB={zones:[],points:[],updated:''};
let GEO=null,BAT={kec:null,desa:null},Z23=null,AOI={awal:null,baru:null};
let ZK={};                       // zona -> kecamatan (dari poligon kecamatan)
let geoDirty=false,loadedInfo=[];
const st={z23:false,z23o:.6,kec:'',desa:'',labm:'none',brk:null,bkec:false,bdesa:false,zon:true,aoiA:false,aoiB:false,svy:'',mode:'nilai',pts:true,tab:'analisis',trend:14,view:'split',kurang:0,jenis:'Transaksi',zsrc:'auto',lsrc:'geo',ssrc:'kolom',mapOpen:null};

/* ---------- util ---------- */
const pick=(o,keys)=>{for(const k of [].concat(keys)){if(o&&k in o&&o[k]!=null&&o[k]!=='')return o[k]}return null};
const numv=v=>{if(v==null||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;let s=String(v).trim().replace(/\s/g,'').replace(/^Rp\.?/i,'');
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');
  else s=s.replace(',','.');
  const x=parseFloat(s);return isNaN(x)?null:x};
const normDate=v=>{if(v==null||v==='')return '';if(v instanceof Date)return v.toISOString().slice(0,10);const s=String(v).trim();let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return m[1]+'-'+m[2]+'-'+m[3];
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/)))return m[1]+'-'+m[2]+'-'+m[3];
  if((m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/)))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return s.slice(0,10)};
const fdate=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
const normGuna=s=>{const g=String(s==null?'':s).trim();if(/non/i.test(g))return 'Non-Pertanian';if(/pertanian/i.test(g))return 'Pertanian';return g};

/* ---------- geometri ringan (tanpa pustaka tambahan) ---------- */
function polysOf(g){if(!g)return[];if(g.type==='Polygon')return[g.coordinates];if(g.type==='MultiPolygon')return g.coordinates;if(g.type==='GeometryCollection')return g.geometries.flatMap(polysOf);return[]}
function bboxPolys(polys){let a=1e9,b=1e9,c=-1e9,d=-1e9;polys.forEach(pg=>pg[0].forEach(p=>{if(p[0]<a)a=p[0];if(p[0]>c)c=p[0];if(p[1]<b)b=p[1];if(p[1]>d)d=p[1]}));return[a,b,c,d]}
function inRing(x,y,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}

/* ---------- nomor zona, luas poligon, dan pemetaan kolom ---------- */
// Nomor zona dibakukan agar " 210p ", "210P", 210.0 dan "0210P" dianggap sama
const zk=v=>{if(v==null)return '';let s=String(v).trim().toUpperCase().replace(/\s+/g,'');if(/^\d+\.0+$/.test(s))s=s.replace(/\.0+$/,'');return s.replace(/^0+(?=\d)/,'')};
// Luas poligon di bola bumi (m²), dari koordinat bujur/lintang. Lubang dikurangkan.
const RAD=Math.PI/180,RE=6371008.8;
function ringArea(r){let s=0;for(let i=0;i<r.length-1;i++){const a=r[i],b=r[i+1];s+=(b[0]-a[0])*RAD*(2+Math.sin(a[1]*RAD)+Math.sin(b[1]*RAD))}return Math.abs(s*RE*RE/2)}
function polysArea(polys){let t=0;polys.forEach(pg=>pg.forEach((r,i)=>{t+=(i?-1:1)*ringArea(r)}));return t}

let RAW={pts:null,zn:null},RAWGEO=null,MAP={pt:{},zn:{}},GIDX=null,geoArea={},DIAG={};
let OVR=(function(){try{const s=JSON.parse(localStorage.getItem('znt-sumedang-map')||'null');if(s){if(s.st)Object.assign(st,s.st);return{pt:s.pt||{},zn:s.zn||{}}}}catch(e){}return{pt:{},zn:{}}})();

function detectCol(fields,s,rows){
  const low=fields.map(f=>f.toLowerCase());
  for(const n of s.names||[]){const i=low.indexOf(n.toLowerCase());if(i>=0)return fields[i]}
  const cand=fields.filter(f=>s.re&&s.re.test(f));
  if(!cand.length)return '';
  if(s.num&&rows&&rows.length){let best=cand[0],bs=-1;const m=Math.min(rows.length,200);
    cand.forEach(f=>{let k=0;for(let i=0;i<m;i++)if(numv(rows[i][f])!=null)k++;if(k>bs){bs=k;best=f}});return best}
  return cand[0];
}
function geoZonaCol(M){if(!RAWGEO)return '';return M.zn.zona&&RAWGEO.fields.includes(M.zn.zona)?M.zn.zona:detectCol(RAWGEO.fields,SPEC.zn.zona,RAWGEO.rows)}
function zoneIds(M){const s=new Set();
  if(RAW.zn&&M.zn.zona)RAW.zn.rows.forEach(r=>{const v=zk(r[M.zn.zona]);if(v)s.add(v)});
  const c=geoZonaCol(M);if(RAWGEO&&c)RAWGEO.rows.forEach(r=>{const v=zk(r[c]);if(v)s.add(v)});
  return s}
// Kolom zona di titik dipilih dari kecocokan nilainya dengan nomor zona yang ada (bukan hanya dari namanya)
function bestZonaCol(L,zs){
  if(!zs.size||!L.rows.length)return '';
  const m=Math.min(L.rows.length,400);let byName={col:'',rate:0},any={col:'',rate:0};
  L.fields.forEach(f=>{let k=0;for(let i=0;i<m;i++){const v=zk(L.rows[i][f]);if(v&&zs.has(v))k++}
    const rate=k/m;if(SPEC.pt.zona.re.test(f)&&rate>byName.rate)byName={col:f,rate};if(rate>any.rate)any={col:f,rate}});
  if(byName.rate>=.3)return byName.col;
  if(any.rate>=.6)return any.col;
  return '';
}
function computeMap(useOvr){
  const pick=(grp,k,L)=>{if(useOvr){const o=OVR[grp];if(k in o&&(o[k]===''||L.fields.includes(o[k])))return o[k]}return detectCol(L.fields,SPEC[grp][k],L.rows)};
  const M={pt:{},zn:{}},ZL=RAW.zn||RAWGEO;
  if(ZL)for(const k in SPEC.zn)M.zn[k]=pick('zn',k,ZL);
  if(RAW.pts){
    for(const k in SPEC.pt)M.pt[k]=pick('pt',k,RAW.pts);
    const o=OVR.pt,forced=useOvr&&'zona' in o&&(o.zona===''||RAW.pts.fields.includes(o.zona));
    if(!forced){const b=bestZonaCol(RAW.pts,zoneIds(M));if(b)M.pt.zona=b}
  }
  return M}
function autoMap(){MAP=computeMap(true)}

/* ---------- memetakan baris mentah -> objek internal ---------- */
function filterKab(rows,col){

  if(!CFG.KAB||!col)return all();
  const ix=[];rows.forEach((r,i)=>{const v=r[col];if(v==null||v===''||CFG.KAB.test(String(v)))ix.push(i)});
  if(!ix.length){DIAG.kabIgnored=true;return all()}
  return ix}
function mapPoint(r,geom,i){const M=MAP.pt,g=k=>M[k]?r[M[k]]:null;
  let x=null,y=null;
  if(geom&&geom.type==='Point'){x=geom.coordinates[0];y=geom.coordinates[1]}
  if(x==null||y==null||(!x&&!y)){x=numv(g('x'));y=numv(g('y'))}
  if(x==null||y==null||Math.abs(x)>180||Math.abs(y)>90){x=0;y=0}
  const no=numv(g('no'));
  return {no:no==null?i+1:Math.round(no),svy:String(g('svy')||'').trim(),tp:normDate(g('tp')),tt:normDate(g('tt')),jenis:String(g('jenis')||'').trim(),
    zKol:zk(g('zona')),zona:'',nilai:numv(g('nilai'))||0,kec:normKec(g('kec')),desa:normDesa(g('desa')),luasT:numv(g('luasT'))||0,
    jalan:String(g('jalan')||'').trim(),akses:String(g('akses')||'').trim(),jns:String(g('jns')||'').trim(),x:x||0,y:y||0}}
function buildZones(){
  const L=RAW.zn,M=MAP.zn,g=(r,k)=>M[k]?r[M[k]]:null,by={};
  filterKab(L.rows,M.kab).forEach(i=>{const r=L.rows[i],id=zk(g(r,'zona'));if(!id)return;
    const la=numv(g(r,'luas'))||0;
    if(by[id]){by[id].luasA+=la;return}
    by[id]={zona:id,guna:normGuna(g(r,'guna')),luasA:la,n:numv(g(r,'n')),rsd:numv(g(r,'rsd')),svy:String(g(r,'svy')||'').trim(),rataA:numv(g(r,'rata'))}});
  return Object.values(by)}
// Luas: dari poligon (m²) bila ada. Kolom luas dikonversi bila satuannya hektare/km² (dideteksi dari rasio terhadap poligon).
function finalizeLuas(zones){
  const rs=zones.filter(z=>z.luasA>0&&geoArea[z.zona]>0).map(z=>z.luasA/geoArea[z.zona]).sort((a,b)=>a-b);
  let F=1,unit='m²',ratio=null;
  if(rs.length>=3){const m=rs[rs.length>>1];let best=null;
    [[1,'m²'],[1e4,'hektare'],[1e6,'km²']].forEach(c=>{const d=Math.abs(Math.log(m*c[0]));if(!best||d<best.d)best={d,F:c[0],unit:c[1]}});
    F=best.F;unit=best.unit;ratio=m*F}
  zones.forEach(z=>{z.luasAttr=z.luasA*F;z.luasGeo=geoArea[z.zona]||0;
    z.luas=(st.lsrc==='kolom'&&z.luasAttr>0)||!z.luasGeo?z.luasAttr:z.luasGeo});
  DIAG.luas={unit,F,ratio,n:rs.length,col:MAP.zn.luas,off:ratio!=null&&Math.abs(Math.log(ratio))>.15,geo:!!GIDX}
}
function spatialZone(x,y){if(!GIDX)return '';for(const g of GIDX){if(x<g.bb[0]||x>g.bb[2]||y<g.bb[1]||y>g.bb[3])continue;if(pip(x,y,g.polys))return g.z}return ''}
// Tentukan zona tiap titik: dari kolom, atau dari lokasi titik di dalam poligon zona
function assignZones(){
  const zset=new Set(DB.zones.map(z=>z.zona));if(GIDX)GIDX.forEach(g=>zset.add(g.z));
  const P=DB.points,tot=P.length,hit=P.filter(p=>p.zKol&&zset.has(p.zKol)).length,rate=tot?hit/tot:0;
  const canSp=!!(GIDX&&GIDX.length)&&P.some(p=>p.x&&p.y);
  let mode=st.zsrc;if(mode==='auto')mode=(rate>=.6||!canSp)?'kolom':'spasial';if(mode==='spasial'&&!canSp)mode='kolom';
  let spHit=0;
  P.forEach(p=>{if(mode==='spasial'){const s=(p.x&&p.y)?spatialZone(p.x,p.y):'';if(s)spHit++;p.zona=s||(zset.has(p.zKol)?p.zKol:'')}else p.zona=p.zKol});
  DIAG.z={mode,rate,hit,tot,canSp,spHit,req:st.zsrc};
}
function remap(){
  DIAG={};DB.points=[];DB.zones=[];GEO=null;GIDX=null;geoArea={};
  const zc=geoZonaCol(MAP);
  if(RAWGEO&&zc){
    const kabG=MAP.zn.kab&&RAWGEO.fields.includes(MAP.zn.kab)?MAP.zn.kab:'';
    const feats=[];
    filterKab(RAWGEO.rows,kabG).forEach(i=>{const gm=RAWGEO.geoms[i];if(!polysOf(gm).length)return;const z=zk(RAWGEO.rows[i][zc]);if(!z)return;feats.push({type:'Feature',geometry:gm,properties:{z}})});
    if(feats.length){GEO={type:'FeatureCollection',features:feats};
      GIDX=feats.map(f=>{const p=polysOf(f.geometry);return{z:f.properties.z,polys:p,bb:bboxPolys(p)}});
      GIDX.forEach(g=>{geoArea[g.z]=(geoArea[g.z]||0)+polysArea(g.polys)})}
  }
  if(RAW.zn&&MAP.zn.zona){DB.zones=buildZones();finalizeLuas(DB.zones)}
  if(RAW.pts){const L=RAW.pts;DB.points=filterKab(L.rows,MAP.pt.kab).map(i=>mapPoint(L.rows[i],L.geoms[i],i))}

/* ---------- pembaca DBF ---------- */
function parseDBF(buf){const dv=new DataView(buf),u8=new Uint8Array(buf),n=dv.getUint32(4,true),hl=dv.getUint16(8,true),rl=dv.getUint16(10,true),dec=new TextDecoder('latin1');
  const f=[];let o=32;while(o<hl-1&&u8[o]!==0x0D){f.push({name:dec.decode(u8.subarray(o,o+11)).split('\0')[0],type:String.fromCharCode(u8[o+11]),len:u8[o+16]});o+=32}
  const rows=[];for(let i=0;i<n;i++){let p=hl+i*rl;if(u8[p]===0x2A)continue;p++;const r={};for(const c of f){const s=dec.decode(u8.subarray(p,p+c.len)).trim();p+=c.len;r[c.name]=(c.type==='N'||c.type==='F')?(s===''?null:parseFloat(s)):s}rows.push(r)}
  return {fields:f.map(c=>c.name),rows}}

/* ---------- memasukkan data yang dimuat ---------- */
function setZ23(fc){
  const props=fc.features.length?fc.features[0].properties||{}:{};
  let vk=[].concat(CFG.Z23.nilai).find(k=>k in props);
  if(!vk)vk=Object.keys(props).find(k=>/nilai|harga|znt|rp/i.test(k)&&numv(props[k])!=null)||'';
  const gk=[].concat(CFG.Z23.guna).find(k=>k in props)||'';
  const feats=[];
  fc.features.forEach(f=>{const polys=polysOf(f.geometry);if(!polys.length)return;const v=numv(f.properties[vk])||0;const g=gk?normGuna(f.properties[gk]):'';
    feats.push({type:'Feature',geometry:f.geometry,properties:{v,g}})});
  Z23={fc:{type:'FeatureCollection',features:feats},items:feats.map(f=>{const polys=polysOf(f.geometry);return{bb:bboxPolys(polys),polys,v:f.properties.v,g:f.properties.g}}),cmp:{}};
  geoDirty=true;
  return 'ZNT 2023 ('+feats.length+' poligon'+(vk?', kolom nilai '+vk:', KOLOM NILAI TIDAK DITEMUKAN, atur CFG.Z23.nilai')+')';
}
function layerOf(fc){const F=fc.features;return{fields:F.length?Object.keys(F[0].properties||{}):[],rows:F.map(f=>f.properties||{}),geoms:F.map(f=>f.geometry||null)}}
function ingest(fc,name){
  if(!fc||!fc.features)return null;
  const n=name.toLowerCase(),L=layerOf(fc);
  if(/2023|znt23/.test(n))return setZ23(fc);
  if(/aoi/.test(n)){const b=/baru|new/.test(n);if(b)AOI.baru=fc;else AOI.awal=fc;geoDirty=true;return 'AOI '+(b?'baru':'awal')}
  const hasPolys=fc.features.some(f=>polysOf(f.geometry).length),hasPt=fc.features.some(f=>f.geometry&&f.geometry.type==='Point');
  const isZn=/zona|zone|znt/.test(n),isPtName=/titik|sampel|sample|point|survei|survey/.test(n);
  const looksPts=!hasPolys&&(hasPt||isPtName||(detectCol(L.fields,SPEC.pt.no,L.rows)&&detectCol(L.fields,SPEC.pt.tp,L.rows)));
  if(looksPts&&!isZn){RAW.pts=L;return 'titik sampel ('+L.rows.length+')'}
  if(/kec/.test(n)&&!isZn){BAT.kec=fc;geoDirty=true;return 'batas kecamatan ('+fc.features.length+')'}
  if(/desa|kel/.test(n)&&!isZn){BAT.desa=fc;geoDirty=true;return 'batas desa ('+fc.features.length+')'}
  if(detectCol(L.fields,SPEC.zn.zona,L.rows)){RAW.zn=L;if(hasPolys)RAWGEO=L;return 'zona ('+L.rows.length+(hasPolys?', dengan poligon':', atribut saja')+')'}
  return null}
async function loadFiles(files){
  const ok=[],bad=[];
  for(const f of files){
    try{
      const buf=await f.arrayBuffer();
      if(/\.zip$/i.test(f.name)){
        let g=await shp(buf);if(!Array.isArray(g))g=[g];
        for(const x of g){const nm=f.name+' '+(x.fileName||'');const r=ingest(x,nm);r?ok.push(r):bad.push(nm+' (jenis tidak dikenali)')}
      }else if(/\.dbf$/i.test(f.name)){
        const d=parseDBF(buf);
        const r=ingest({type:'FeatureCollection',features:d.rows.map(p=>({type:'Feature',properties:p,geometry:null}))},f.name);
        r?ok.push(r):bad.push(f.name+' (kolom tidak dikenali)')
      }else bad.push(f.name+' (gunakan .zip atau .dbf)')
    }catch(err){bad.push(f.name+' ('+err.message+')')}
  }
  if(ok.length){DB.updated='file manual '+new Date().toLocaleString('id-ID');loadedInfo=ok}
  autoMap();remap();refresh();
  const m=$('#syncmsg');if(m)m.innerHTML=(ok.length?'Dimuat: '+ok.map(esc).join(', ')+'. ':'')+(bad.length?'<span style="color:var(--bad)">Tidak dikenali: '+bad.map(esc).join(', ')+'</span>':'')
}

/* ---------- indeks geometri: kecamatan per zona dan pembanding ZNT 2023 ---------- */
function buildGeoIndex(){
  ZK={};if(Z23)Z23.cmp={};
  if(!GEO)return;
  const gunaOf={};DB.zones.forEach(z=>gunaOf[z.zona]=z.guna);
  const kecI=BAT.kec?BAT.kec.features.map(f=>{const p=polysOf(f.geometry);return{n:normKec(nameOf(f.properties,CFG.KEC.nama)),p,bb:bboxPolys(p)}}):[];
  GEO.features.forEach(f=>{
    const polys=polysOf(f.geometry);if(!polys.length)return;
    const bb=bboxPolys(polys),zid=f.properties.z,S=zoneSamples(polys,bb);if(!S.length)return;
    if(kecI.length){const cnt={};S.forEach(([x,y])=>{for(const k of kecI){if(x<k.bb[0]||x>k.bb[2]||y<k.bb[1]||y>k.bb[3])continue;if(pip(x,y,k.p)){cnt[k.n]=(cnt[k.n]||0)+1;break}}});
      ZK[zid]=Object.entries(cnt).filter(([,c])=>c/S.length>=.1).sort((a,b)=>b[1]-a[1]).map(a=>a[0])}
    if(Z23){const zg=gunaOf[zid]||'';
      const cands=Z23.items.filter(it=>it.v>0&&it.bb[0]<=bb[2]&&it.bb[2]>=bb[0]&&it.bb[1]<=bb[3]&&it.bb[3]>=bb[1]&&(!zg||!it.g||it.g===zg));
      let hit=0,sum=0;S.forEach(([x,y])=>{for(const it of cands){if(x<it.bb[0]||x>it.bb[2]||y<it.bb[1]||y>it.bb[3])continue;if(pip(x,y,it.polys)){hit++;sum+=it.v;break}}});
      Z23.cmp[zid]={v:hit?sum/hit:0,c:hit/S.length}}
  });
}

/* ---------- hitung ---------- */
let C={zones:[],byZ:{},svys:[],points:[],diag:{}};
const targetOf=ha=>CFG.TARGET(ha);
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?0:j}for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function canonSvy(n,known){if(!n||n==='-'||known.includes(n))return n;let best=n,bd=3;known.forEach(k=>{const d=lev(n.toLowerCase(),k.toLowerCase());if(d<bd){bd=d;best=k}});return best}
function compute(){
  const valid={},psv={},dsz={},ksz={},vals={};
  DB.points.forEach(p=>{(dsz[p.zona]=dsz[p.zona]||new Set()).add(p.desa);if(p.kec)(ksz[p.zona]=ksz[p.zona]||new Set()).add(p.kec);
    if(p.nilai>0){valid[p.zona]=(valid[p.zona]||0)+1;(vals[p.zona]=vals[p.zona]||[]).push(p.nilai)}
    const o=psv[p.zona]=psv[p.zona]||{};o[p.svy]=(o[p.svy]||0)+1});
  const known=[...new Set(DB.points.map(p=>p.svy).filter(Boolean))];
  const useAttr=st.ssrc!=='titik';   // statistik zona dari kolom atribut zona (Jml_Titik, RSD) atau dihitung dari titik sampel
  const zones=DB.zones.map(z=>{
    const ha=z.luas/10000,target=targetOf(ha),vv=vals[z.zona],nPts=valid[z.zona]||0;
    const n=useAttr&&z.n!=null?z.n:nPts;
    let rsd=useAttr?z.rsd:null;
    if(rsd==null&&vv&&vv.length>=CFG.MIN_TITIK){const m=vv.reduce((s,x)=>s+x,0)/vv.length;rsd=Math.sqrt(vv.reduce((s,x)=>s+(x-m)**2,0)/(vv.length-1))/m*100}
    let svy=z.svy&&z.svy!=='-'?canonSvy(z.svy,known):'';
    if(!svy&&psv[z.zona]){const e=Object.entries(psv[z.zona]).filter(a=>a[0]).sort((a,b)=>b[1]-a[1])[0];if(e)svy=e[0]}
    const cap=n>=target?'Selesai':n>0?'Proses':'Belum';
    const qc=n===0?'Belum':n<CFG.MIN_TITIK?'Kurang':(rsd!=null&&rsd>CFG.RSD_MAX)?'Revisi':'Valid';
    const c23=Z23&&Z23.cmp[z.zona],v23=c23&&c23.v>0&&c23.c>=.5?c23.v:null;
    const rata=vv&&vv.length?vv.reduce((a,x)=>a+x,0)/vv.length:(useAttr&&z.rataA>0?z.rataA:null);
    const delta=v23&&rata>0?(rata/v23-1)*100:null;
    const ks=[...new Set([...(ZK[z.zona]||[]),...(ksz[z.zona]||[])])].sort();
    return {...z,v23,delta,ha,target,n,nPts,rsd,rata,ks,ds:[...(dsz[z.zona]||[])].filter(Boolean),svy:svy||UNK,cap,qc,kurang:Math.max(target-n,0)};
  });
  const byZ={};zones.forEach(z=>byZ[z.zona]=z);
  const svys=[...new Set(zones.map(z=>z.svy))].filter(s=>s!==UNK).sort();
  const P=DB.points,nv=P.filter(p=>p.nilai>0).map(p=>p.nilai);
  const diag={pts:P.length,matched:P.filter(p=>p.zona&&byZ[p.zona]).length,noZona:P.filter(p=>!p.zona).length,unknownZona:P.filter(p=>p.zona&&!byZ[p.zona]).length,

function trendSvg(P){
  const by={};P.forEach(p=>{if(!p.tp)return;(by[p.tp]=by[p.tp]||{})[p.svy]=((by[p.tp]||{})[p.svy]||0)+1});
  let days=Object.keys(by).sort();if(!days.length)return '<div class="empty">Belum ada data.</div>';
  const last=days[days.length-1];
  if(st.trend){const d0=new Date(last+'T00:00:00Z');const all=[];for(let i=st.trend-1;i>=0;i--){const d=new Date(d0);d.setUTCDate(d.getUTCDate()-i);all.push(d.toISOString().slice(0,10))}days=all}
  else{const a=new Date(days[0]+'T00:00:00Z'),b=new Date(last+'T00:00:00Z'),all=[];for(let d=a;d<=b;d.setUTCDate(d.getUTCDate()+1))all.push(d.toISOString().slice(0,10));days=all}
  const sv=[...new Set(P.map(p=>p.svy))].sort();
  const tot=days.map(d=>Object.values(by[d]||{}).reduce((s,x)=>s+x,0));
  const max=Math.max(5,Math.ceil(Math.max(...tot)/5)*5);
  const W=380,H=190,L=28,R=6,T=14,B=28,bw=(W-L-R)/days.length;
  let g='';
  [0,.5,1].forEach(f=>{const y=T+(H-T-B)*(1-f);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-4}" y="${y+3}" text-anchor="end">${Math.round(max*f)}</text>`});
  days.forEach((d,i)=>{let y=H-B;sv.forEach(s=>{const v=(by[d]||{})[s]||0;if(!v)return;const h=v/max*(H-T-B);y-=h;g+=`<rect x="${L+i*bw+bw*.12}" y="${y}" width="${bw*.76}" height="${h}" fill="${svyCol(s)}"><title>${fdate(d)} ${esc(s)}: ${v}</title></rect>`});
    if(tot[i]&&tot[i]===Math.max(...tot))g+=`<text x="${L+i*bw+bw/2}" y="${y-3}" text-anchor="middle" font-weight="700">${tot[i]}</text>`;
    const every=Math.ceil(days.length/6);if((days.length-1-i)%every===0)g+=`<text x="${L+i*bw+bw/2}" y="${H-10}" text-anchor="middle">${fdate(d)}</text>`});
  const leg=sv.map(s=>`<span style="margin-right:12px"><i class="dot" style="background:${svyCol(s)}"></i> ${esc(s||'-')}</span>`).join('');
  const avg=tot.reduce((a,b)=>a+b,0)/days.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Jumlah titik sampel per hari">${g}</svg><div class="sub">${leg}</div><div class="sub" style="margin-top:4px">Rata-rata ${fmt(avg,1)} titik per hari &middot; tertinggi ${Math.max(...tot)} titik pada ${fdate(days[tot.indexOf(Math.max(...tot))])}</div>`;
}

let map,REND,zoneLayer,layers={},layers23,ptLayer,labLayer,ptMarkers={},aoiLayer={},bLayer={};
function initMap(){

  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri World Imagery'});
  const esriStreet=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri, HERE, Garmin, OpenStreetMap contributors'});
  const esriTopo=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri, HERE, Garmin, USGS, OpenStreetMap contributors'});
  esriStreet.addTo(map);
  L.control.layers({'Peta jalan (Esri)':esriStreet,'Topografi (Esri)':esriTopo,'Satelit (Esri)':sat,'OpenStreetMap':osm,'Tanpa peta dasar':L.layerGroup()},null,{position:'topright'}).addTo(map);
  map.on('popupopen',e=>{const a=e.popup.getElement().querySelector('.zlink');if(!a)return;
    a.onclick=ev=>{ev.preventDefault();const l=layers[a.dataset.z];if(!l)return;map.closePopup();l.openPopup(L.latLng(+a.dataset.lat,+a.dataset.lng))}});
  map.on('zoomend',()=>ptResize());

}
function clearMapLayers(){

function popup(zn){const z=C.byZ[zn];if(!z)return `<b>Zona ${esc(zn)}</b><br>Belum ada data atribut untuk zona ini.`;
  const pts=C.points.filter(p=>p.zona===zn).sort((a,b)=>(a.no||0)-(b.no||0));
  const v=pts.filter(p=>p.nilai>0),mean=v.length?v.reduce((a,p)=>a+p.nilai,0)/v.length:null;
  const surplus=Math.max(z.n-z.target,0);
  const badge=z.cap==='Selesai'?`<span class="pill good">Target Selesai (${Math.min(z.n,z.target)}/${z.target})${surplus?` (+${surplus} surplus)`:''}</span>`:z.cap==='Proses'?`<span class="pill warn">Proses (${z.n}/${z.target})</span>`:`<span class="pill bad">Belum Survei (0/${z.target})</span>`;
  const kat=z.ha<=900?'< 900 Ha':z.ha<=1250?'900 - 1250 Ha':'> 1250 Ha';
  const jc={};pts.forEach(p=>jc[p.jenis]=(jc[p.jenis]||0)+1);

  const r=(k,val)=>`<div class="pr"><span>${k}</span><b>${val}</b></div>`;
  return `<div class="pop"><div class="ph"><span class="pbar" style="background:${svyCol(z.svy)}"></span><b>Zona ${esc(zn)}</b>${badge}</div>
  ${r('Surveyor Wilayah',`<span style="color:${svyCol(z.svy)}">${esc(z.svy)}</span>`)}${r('Luasan Zona',fmt(z.ha,2)+' Ha')}${r('Kategori Target',kat)}${r('Target Wajib',z.target+' Titik Sampel')}
  ${r('Titik di Lapangan',pts.length+' Titik')}${r('Dihitung untuk Target',Math.min(z.n,z.target)+' / '+z.target+' Titik')}${r('Penggunaan Tanah',esc(z.guna||'-'))}${r('Kecamatan',esc(z.ks.join(', ')||'-'))}${z23row(z)}${r('Jenis Data',jenis)}
  <div class="pq"><div class="pt">QUALITY CONTROL</div>${r('Status QC',qcb)}${r('Rata-rata Nilai',mean==null?'-':'Rp '+fmt(mean)+' / m²')}${r('RSD / Variasi',z.rsd==null?'-':fmt(z.rsd,2)+'%')}</div>
  ${pts.length?`<details open><summary>Daftar titik (${pts.length})</summary><div class="scroll" style="max-height:170px;margin-top:6px"><table><thead><tr><th>No</th><th>Jenis</th><th>Tgl</th><th class="n">Rp/m²</th></tr></thead><tbody>${pts.map(p=>`<tr><td>${p.no}</td><td>${esc(p.jenis)}</td><td>${fdate(p.tp)}</td><td class="n">${fmt(p.nilai)}</td></tr>`).join('')}</tbody></table></div></details>`:''}</div>`}
const ptR=()=>map&&map.getZoom()>=15?7:map&&map.getZoom()>=13?5.5:4.5;

  ${r('Nilai tanah','Rp '+fmt(p.nilai)+' /m²')}${r('Zona',p.zona?esc(p.zona)+(z?' ('+esc(z.guna)+')':''):'<i>tanpa zona</i>')}${r('Surveyor',`<span style="color:${svyCol(p.svy)}">${esc(p.svy)}</span>`)}
  ${r('Tgl pelaksanaan',fdate(p.tp)||'-')}${r('Tgl transaksi',fdate(p.tt)||'-')}${r('Kecamatan / desa',esc(p.kec||'-')+' / '+esc(p.desa||'-'))}
  ${r('Luas tanah',p.luasT?fmt(p.luasT)+' m²':'-')}${r('Jalan / akses',esc(p.jalan||'-')+' / '+esc(p.akses||'-'))}${r('Peruntukan',esc(p.jns||'-'))}
  ${p.zona&&z&&layers[p.zona]?`<button class="btn ghost" data-lz="${esc(p.zona)}" style="margin-top:8px;padding:4px 10px;font-size:12px">Lihat zona ${esc(p.zona)}</button>`:''}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-lz]');if(b){map.closePopup();focusZone(b.dataset.lz)}});

/* ---------- analisis nilai tanah ---------- */
function analisis(Z,P){
  const gz=p=>(C.byZ[p.zona]||{}).guna||'';
  const V=P.filter(p=>p.nilai>0&&p.zona).map(p=>({...p,guna:gz(p)}));
  const med={};['Pertanian','Non-Pertanian'].forEach(g=>med[g]=median(V.filter(p=>p.guna===g).map(p=>p.nilai)));
  const pf=p=>{const f=[],m=med[p.guna];
    if(p.luasT>0&&p.luasT<100)f.push('tanah sangat kecil ('+fmt(p.luasT)+' m²), harga per m² cenderung tinggi');
    if(p.luasT>=10000)f.push('tanah sangat luas ('+fmt(p.luasT)+' m²), harga per m² cenderung rendah');
    if(p.akses==='Sangat Baik')f.push('akses sangat baik');else if(p.akses==='Kurang')f.push('akses kurang');
    if(p.jalan==='Setapak')f.push('jalan setapak');else if(p.jalan==='Arteri'||p.jalan==='Kolektor')f.push('jalan '+p.jalan.toLowerCase());
    if(p.jns==='Komersial')f.push('peruntukan komersial');
    f.push(p.jenis==='Transaksi'?'data transaksi':p.jenis==='Penawaran'?'harga penawaran':'data '+String(p.jenis).toLowerCase());
    if(m&&p.nilai>3*m)f.push('lebih dari 3x median '+p.guna.toLowerCase()+' (Rp '+fmt(m)+'), perlu verifikasi');
    if(m&&p.nilai<.3*m)f.push('kurang dari 0,3x median '+p.guna.toLowerCase()+' (Rp '+fmt(m)+'), perlu verifikasi');
    return f.join('; ')};
  const pcols=[{h:'No',v:r=>r.no},{h:'Zona',v:r=>r.zona},{h:'Kecamatan',v:r=>r.kec},{h:'Desa',v:r=>r.desa},{h:'Jenis data',v:r=>r.jenis},{h:'Rp/m²',n:1,v:r=>Math.round(r.nilai),html:r=>fmt(r.nilai)},{h:'Luas tanah (m²)',n:1,v:r=>r.luasT,html:r=>fmt(r.luasT)},{h:'Jalan',v:r=>r.jalan},{h:'Akses',v:r=>r.akses},{h:'Indikator dari data',v:r=>pf(r)}];
  const zf=z=>{const f=[];if(z.n<CFG.MIN_TITIK)f.push('hanya '+z.n+' titik');if(z.rsd!=null)f.push('RSD '+fmt(z.rsd,1)+'%'+(z.rsd>CFG.RSD_MAX?' (di atas '+CFG.RSD_MAX+'%)':''));f.push(fmt(z.ha,0)+' ha');return f.join('; ')};
  const zcols=[{h:'Zona',v:r=>r.zona},{h:'Kecamatan',v:r=>r.ks.join(', ')},{h:'Titik',n:1,v:r=>r.n},{h:'Rata-rata Rp/m²',n:1,v:r=>Math.round(r.rata),html:r=>fmt(r.rata)},{h:'RSD (%)',n:1,v:r=>r.rsd==null?'':+r.rsd.toFixed(1)},{h:'Indikator dari data',v:r=>zf(r)}];
  const blocks=[];
  ['Pertanian','Non-Pertanian'].forEach(g=>{const q=V.filter(p=>p.guna===g);
    blocks.push({t:'Harga tertinggi: '+g+' (titik)',c:pcols,r:q.slice().sort((a,b)=>b.nilai-a.nilai).slice(0,5)});
    blocks.push({t:'Harga terendah: '+g+' (titik)',c:pcols,r:q.slice().sort((a,b)=>a.nilai-b.nilai).slice(0,5)})});
  ['Pertanian','Non-Pertanian'].forEach(g=>{const q=Z.filter(z=>z.guna===g&&z.rata>0&&z.n>=CFG.MIN_TITIK);
    blocks.push({t:'Zona dengan rata-rata tertinggi: '+g+' (minimal '+CFG.MIN_TITIK+' titik)',c:zcols,r:q.slice().sort((a,b)=>b.rata-a.rata).slice(0,5)});
    blocks.push({t:'Zona dengan rata-rata terendah: '+g+' (minimal '+CFG.MIN_TITIK+' titik)',c:zcols,r:q.slice().sort((a,b)=>a.rata-b.rata).slice(0,5)})});
  const cnt={};P.forEach(p=>{if(p.zona)cnt[p.zona]=(cnt[p.zona]||0)+1});
  const top=Z.map(z=>({...z,tot:cnt[z.zona]||0})).sort((a,b)=>b.tot-a.tot).slice(0,8);
  const tcols=[{h:'Zona',v:r=>r.zona},{h:'Peruntukan',v:r=>r.guna},{h:'Kecamatan',v:r=>r.ks.join(', ')},{h:'Titik',n:1,v:r=>r.tot},{h:'Target',n:1,v:r=>r.target},{h:'Luas (ha)',n:1,v:r=>+r.ha.toFixed(0)},{h:'RSD (%)',n:1,v:r=>r.rsd==null?'':+r.rsd.toFixed(1)},{h:'Surveyor',v:r=>r.svy},{h:'Indikator dari data',v:r=>{const f=[];f.push(r.tot>r.target?'melebihi target ('+r.tot+' dari '+r.target+')':'sesuai target');if(r.rsd!=null&&r.rsd>CFG.RSD_MAX)f.push('RSD di atas '+CFG.RSD_MAX+'%, indikasi titik ditambah untuk menurunkan RSD');f.push('titik per 100 ha: '+fmt(r.tot/(r.ha/100),1));return f.join('; ')}}];
  blocks.push({t:'Jumlah sampel terbanyak per zona',c:tcols,r:top});
  let pembanding='';
  if(Z23){const rows=[];const kk=[...new Set(Z.flatMap(z=>z.ks))].sort();
    kk.forEach(k=>['Pertanian','Non-Pertanian'].forEach(g=>{const q=Z.filter(z=>z.ks.includes(k)&&z.guna===g&&z.delta!=null);if(!q.length)return;const w=q.reduce((a,z)=>a+z.ha,0),m26=q.reduce((a,z)=>a+z.rata*z.ha,0)/w,m23=q.reduce((a,z)=>a+z.v23*z.ha,0)/w;rows.push({k,g,n:q.length,m23,m26,d:(m26/m23-1)*100})}));
    const dc=[{h:'Kecamatan',v:r=>r.k},{h:'Peruntukan',v:r=>r.g},{h:'Zona dibandingkan',n:1,v:r=>r.n},{h:'ZNT 2023 (Rp/m²)',n:1,v:r=>Math.round(r.m23),html:r=>fmt(r.m23)},{h:'Survei 2026 (Rp/m²)',n:1,v:r=>Math.round(r.m26),html:r=>fmt(r.m26)},{h:'Perubahan (%)',n:1,v:r=>+r.d.toFixed(1),html:r=>(r.d>0?'+':'')+fmt(r.d,1)+'%'}];
    const zq=Z.filter(z=>z.delta!=null),zc=[{h:'Zona',v:r=>r.zona},{h:'Peruntukan',v:r=>r.guna},{h:'Kecamatan',v:r=>r.ks.join(', ')},{h:'Titik',n:1,v:r=>r.n},{h:'ZNT 2023',n:1,v:r=>r.v23,html:r=>fmt(r.v23)},{h:'Survei 2026',n:1,v:r=>Math.round(r.rata),html:r=>fmt(r.rata)},{h:'Perubahan (%)',n:1,v:r=>+r.delta.toFixed(1),html:r=>(r.delta>0?'+':'')+fmt(r.delta,1)+'%'}];
    blocks.unshift({t:'Perubahan nilai: survei 2026 vs ZNT 2023, per kecamatan (rata-rata tertimbang luas zona)',c:dc,r:rows.sort((a,b)=>b.d-a.d)},{t:'Zona dengan kenaikan terbesar vs 2023 (minimal '+CFG.MIN_TITIK+' titik)',c:zc,r:zq.filter(z=>z.n>=CFG.MIN_TITIK).sort((a,b)=>b.delta-a.delta).slice(0,5)},{t:'Zona dengan penurunan terbesar vs 2023 (minimal '+CFG.MIN_TITIK+' titik)',c:zc,r:zq.filter(z=>z.n>=CFG.MIN_TITIK).sort((a,b)=>a.delta-b.delta).slice(0,5)});
    pembanding=' Pembanding 2023: zona 2026 dicocokkan ke poligon ZNT 2023 yang sejenis (Pertanian dengan Pertanian, Non-Pertanian dengan Non-Pertanian). Kecocokan dihitung dari sebaran titik sampel grid di dalam zona (pendekatan, bukan irisan geometri persis), dan hanya dipakai bila poligon 2023 menutupi minimal 50% zona.';
  }
  const html='<p class="note" style="margin-top:0">Indikator dihitung otomatis dari atribut data (luas tanah, akses, jenis data, perbandingan dengan median). Ini petunjuk untuk verifikasi, bukan penyebab pasti. Mengikuti filter surveyor, kecamatan, dan desa di panel kiri.'+pembanding+' Nilai 2026 masih rata-rata sampel survei, bukan nilai final.</p>'+blocks.map(b=>`<h3 style="font-size:13px;margin:16px 0 6px">${esc(b.t)}</h3>${table(b.c,b.r)}`).join('');
  const copy=blocks.map(b=>b.t+'\n'+tsv(b.c,b.r)).join('\n\n');
  return {html,copy,desc:'Harga tertinggi dan terendah, serta zona dengan sampel terbanyak, beserta indikator dari data.'};
}

/* ---------- rekap tabel ---------- */
function table(cols,rows){
  if(!rows.length)return '<div class="empty">Tidak ada data.</div>';
  return `<div class="scroll"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr ${r.zona&&layers[r.zona]?`data-z="${esc(r.zona)}" tabindex="0"`:''}>`+cols.map(c=>`<td class="${c.n?'n':''}">${c.html?c.html(r):esc(c.v(r)==null?'':c.v(r))}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`;
}
const tsv=(cols,rows)=>[cols.map(c=>c.h).join('\t'),...rows.map(r=>cols.map(c=>c.v(r)==null?'':c.v(r)).join('\t'))].join('\n');
let COPY='';
const TABS=[['analisis','Analisis nilai tanah'],['belum','Belum survei'],['kurang','Sampel kurang'],['rsd','RSD di atas '+CFG.RSD_MAX+'%'],['tgl','Tanggal transaksi'],['zona','Semua zona']];
function rekap(){
  let cols,rows,desc,custom=null;
  const Z=C.zones.filter(vis);
  const zc=[{h:'No. Zona',v:r=>r.zona},{h:'Surveyor',v:r=>r.svy}];
  if(st.tab==='analisis'){const A=analisis(Z,C.points.filter(visP));custom=A.html;COPY=A.copy;desc=A.desc}
  else if(st.tab==='belum'){rows=Z.filter(z=>z.n===0).sort((a,b)=>a.svy.localeCompare(b.svy)||zsort(a.zona,b.zona));
    cols=[{h:'Surveyor',v:r=>r.svy},{h:'No. Zona',v:r=>r.zona},{h:'Penggunaan',v:r=>r.guna},{h:'Luas (ha)',n:1,v:r=>+r.ha.toFixed(1)},{h:'Target',n:1,v:r=>r.target}];
    const by={};rows.forEach(r=>by[r.svy]=(by[r.svy]||0)+1);desc=`${rows.length} zona belum ada titik. `+Object.entries(by).map(([s,n])=>`${esc(s)}: ${n}`).join(' &middot; ')}
  else if(st.tab==='kurang'){rows=Z.filter(z=>z.kurang>0&&(!st.kurang||z.kurang===st.kurang)).sort((a,b)=>b.kurang-a.kurang||zsort(a.zona,b.zona));
    cols=[...zc,{h:'Luas (ha)',n:1,v:r=>+r.ha.toFixed(1)},{h:'Target',n:1,v:r=>r.target},{h:'Jumlah titik',n:1,v:r=>r.n},{h:'Kurang',n:1,v:r=>r.kurang,html:r=>`<span class="pill ${r.kurang>=3?'bad':'warn'}">kurang ${r.kurang}</span>`}];
    desc=`${rows.length} zona masih kurang sampel (termasuk yang belum disurvei). Tampilkan <select id="kf">${[0,1,2,3,4,5].map(i=>`<option value="${i}" ${st.kurang===i?'selected':''}>${i?'Kurang '+i:'Semua'}</option>`).join('')}</select>`}
  else if(st.tab==='rsd'){rows=Z.filter(z=>z.rsd!=null&&z.rsd>CFG.RSD_MAX).sort((a,b)=>b.rsd-a.rsd);
    cols=[...zc,{h:'Jumlah titik',n:1,v:r=>r.n},{h:'RSD (%)',n:1,v:r=>+r.rsd.toFixed(2),html:r=>`<span class="pill rsd">${fmt(r.rsd,2)}</span>`}];
    desc=`${rows.length} zona dengan RSD di atas ${CFG.RSD_MAX}% dan perlu revisi atau tambahan sampel.`}
  else if(st.tab==='tgl'){const j=st.jenis;
    rows=C.points.filter(p=>visP(p)&&p.tp&&p.tp===p.tt&&(j==='Semua'||p.jenis===j)).sort((a,b)=>a.svy.localeCompare(b.svy)||a.no-b.no);
    cols=[{h:'No. Sampel',v:r=>r.no},{h:'Surveyor',v:r=>r.svy},{h:'Jenis data',v:r=>r.jenis},{h:'Zona',v:r=>r.zona},{h:'Tgl pelaksanaan',v:r=>r.tp},{h:'Keterangan',v:r=>'Tanggal transaksi sama dengan tanggal pelaksanaan'}];
    const tot=C.points.filter(p=>j==='Semua'||p.jenis===j).length;
    desc=`${rows.length} dari ${tot} titik berjenis ${j==='Semua'?'apa pun':j} bertanggal transaksi sama dengan tanggal pelaksanaan. Jenis <select id="jf">${['Transaksi','Individual','Penawaran','Semua'].map(x=>`<option ${x===j?'selected':''}>${x}</option>`).join('')}</select>`}
  else{rows=Z.slice().sort((a,b)=>zsort(a.zona,b.zona));
    cols=[{h:'No. Zona',v:r=>r.zona},{h:'Penggunaan',v:r=>r.guna},{h:'Surveyor',v:r=>r.svy},{h:'Luas (ha)',n:1,v:r=>+r.ha.toFixed(1)},{h:'Target',n:1,v:r=>r.target},{h:'Titik',n:1,v:r=>r.n},{h:'RSD (%)',n:1,v:r=>r.rsd==null?'':+r.rsd.toFixed(2)},{h:'Capaian',v:r=>r.cap},{h:'QC',v:r=>r.qc}];
    desc=`Semua ${rows.length} zona.`}
  if(!custom)COPY=tsv(cols,rows);
  $('#rekap').innerHTML=`<div class="tabs" role="tablist">${TABS.map(t=>`<button class="tab" role="tab" data-tab="${t[0]}" aria-selected="${t[0]===st.tab}">${t[1]}</button>`).join('')}</div>
  <div class="panel"><div class="tools"><p>${desc}</p><button class="btn ghost" id="copy">Salin untuk spreadsheet</button></div>${custom||table(cols,rows)}<p class="note">Klik baris zona untuk melihatnya di peta.</p></div>`;
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;rekap()});
  document.querySelectorAll('tr[data-z]').forEach(tr=>{const go=()=>focusZone(tr.dataset.z);tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter')go()}});
  const cp=$('#copy');cp.onclick=()=>{const done=()=>{cp.textContent='Tersalin'};(navigator.clipboard?navigator.clipboard.writeText(COPY):Promise.reject()).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=COPY;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){cp.textContent='Gagal menyalin'}ta.remove()})};
  const kf=$('#kf');if(kf)kf.onchange=()=>{st.kurang=+kf.value;rekap()};
  const jf=$('#jf');if(jf)jf.onchange=()=>{st.jenis=jf.value;rekap()};
}

/* ---------- kontrol ---------- */
function zoomFilter(){
  if(!map)return;
  if(st.kec&&BAT.kec){const f=BAT.kec.features.find(f=>normKec(nameOf(f.properties,CFG.KEC.nama))===st.kec);if(f){map.fitBounds(L.geoJSON(f).getBounds());return}}
  if(st.desa){const ps=C.points.filter(visP).filter(p=>p.x&&p.y).map(p=>[p.y,p.x]);if(ps.length){map.fitBounds(L.latLngBounds(ps).pad(.2));return}}
  if(zoneLayer){const ls=Object.entries(layers).filter(([z])=>C.byZ[z]&&vis(C.byZ[z])).map(a=>a[1]);
    if(ls.length&&ls.length<Object.keys(layers).length)map.fitBounds(L.featureGroup(ls).getBounds());else map.fitBounds(zoneLayer.getBounds())}
}
function applyFilter(){side();restyle();drawPts();legend();rekap();zoomFilter()}
function setSvy(s){st.svy=s;applyFilter()}
function setKec(k){st.kec=k;st.desa='';applyFilter()}
function setDesa(d){st.desa=d;applyFilter()}
function resetAll(){st.svy='';st.kec='';st.desa='';applyFilter()}
function setView(v){st.view=v;document.body.className='v-'+v;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(map)setTimeout(()=>map.invalidateSize(),50)}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('#mmode').onchange=e=>{st.mode=e.target.value;restyle();drawPts();legend();drawLabels()};
$('#mpts').onchange=e=>{st.pts=e.target.checked;drawPts();legend()};
$('#mzon').onchange=e=>{st.zon=e.target.checked;showZon();legend()};
$('#mlab').onchange=e=>{st.labm=e.target.value;drawLabels()};
$('#z23').onchange=e=>{st.z23=e.target.checked;showZ23()};$('#z23r').oninput=e=>{st.z23o=e.target.value/100;showZ23()};
$('#bkec').onchange=e=>{st.bkec=e.target.checked;showBatas()};
$('#bdesa').onchange=e=>{st.bdesa=e.target.checked;showBatas()};
$('#aoiA').onchange=e=>{st.aoiA=e.target.checked;showAoi()};
$('#aoiB').onchange=e=>{st.aoiB=e.target.checked;showAoi()};
$('#aoiZ').onclick=()=>{const ks=['A','B'].filter(k=>aoiLayer[k]);if(!ks.length){alert('Layer AOI belum dimuat. Beri nama file zip mengandung "aoi_awal" atau "aoi_baru".');return}
  ks.forEach(k=>{if(!st['aoi'+k]){st['aoi'+k]=true;$('#aoi'+k).checked=true}});showAoi();map.fitBounds(L.featureGroup(ks.map(k=>aoiLayer[k])).getBounds())};
$('#pick').onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)await loadFiles(fs)};

/* ---------- unduh CSV ---------- */
function dl(name,rows){
  const csv='﻿'+rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function csvZona(){const rows=[['No. Zona','Penggunaan','Surveyor','Luas (ha)','Target','Jumlah titik','Capaian','QC','RSD (%)','Rata-rata Rp/m2','ZNT 2023','Perubahan vs 2023 (%)']];
  C.zones.filter(vis).sort((a,b)=>zsort(a.zona,b.zona)).forEach(z=>rows.push([z.zona,z.guna,z.svy,+z.ha.toFixed(2),z.target,z.n,z.cap,z.qc,z.rsd==null?'':+z.rsd.toFixed(2),z.rata==null?'':Math.round(z.rata),z.v23==null?'':Math.round(z.v23),z.delta==null?'':+z.delta.toFixed(1)]));dl('zona_sumedang.csv',rows)}
function csvTitik(){const rows=[['No. Sampel','Surveyor','Jenis data','Zona','Tgl pelaksanaan','Tgl transaksi','Nilai tanah (Rp/m2)','Kecamatan','Desa','X','Y']];
  C.points.filter(visP).sort((a,b)=>(a.no||0)-(b.no||0)).forEach(p=>rows.push([p.no,p.svy,p.jenis,p.zona,p.tp,p.tt,p.nilai,p.kec,p.desa,p.x,p.y]));dl('titik_sumedang.csv',rows)}

/* ---------- data contoh (acak, hanya untuk mencoba tampilan) ---------- */
function loadDemo(){
  const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
  const x0=107.76,y0=-6.99,nrow=8,ncol=10,hy=0.02;
  const kecs=['Sumedang Utara','Sumedang Selatan','Cimalaka','Tanjungsari','Jatinangor'];
  const svs=['Andi Saputra','Budi Santoso'];
  const xs=[x0];for(let i=0;i<ncol;i++)xs.push(xs[i]+0.022+0.012*((i*7)%3)/2);
  const sq=(a,b,c,d)=>({type:'Polygon',coordinates:[[[a,b],[c,b],[c,d],[a,d],[a,b]]]});
  const zRows=[],zGeo=[],pRows=[],z23=[],kecF=[],desaF=[];let id=0,no=0;
  const today=new Date();
  for(let j=0;j<nrow;j++)for(let i=0;i<ncol;i++){
    id++;const a=xs[i],c=xs[i+1],b=y0+j*hy,d=b+hy;
    const guna=(i+j)%3===0?'Pertanian':'Non-Pertanian',zid=id+(guna==='Pertanian'?'P':'N');
    const base=guna==='Pertanian'?rnd(60000,180000):rnd(200000,900000)*(0.7+i/ncol*0.6);
    const noise=Math.random()<.18?.5:.15;
    zRows.push({HISTZONE:zid,PENGGUNAAN:guna,Luas_M2:Math.round(polysArea([sq(a,b,c,d).coordinates])),Surveyor:i<5?svs[0]:svs[1]});zGeo.push(sq(a,b,c,d));
    const np=Math.random()<.15?0:ri(1,6);
    for(let k=0;k<np;k++){no++;const dd=ri(0,20),tp=new Date(today.getTime()-dd*864e5).toISOString().slice(0,10);
      const jenis=['Transaksi','Transaksi','Individual','Penawaran'][ri(0,3)];
      const tt=jenis==='Transaksi'&&Math.random()<.12?tp:new Date(today.getTime()-(dd+ri(3,60))*864e5).toISOString().slice(0,10);
      pRows.push({Nomor_Samp:no,Tanggal_Pe:tp,Tanggal__1:tt,Nama_Surve:i<5?svs[0]:svs[1],Jenis_Data:jenis,HISTZONE:Math.random()<.01?'':zid,
        Nilai_Ta_1:Math.random()<.03?0:Math.round(base*(1+rnd(-noise,noise))/1000)*1000,Kecamatan:kecs[Math.floor(i/2)],
        Kelurahan:'Desa '+kecs[Math.floor(i/2)].split(' ').pop()+' '+(j%3+1),Luas_tanah:Math.round(rnd(60,1500)),Kelas_Jala:['Lokal','Setapak','Kolektor'][ri(0,2)],
        Aksesibili:['Baik','Kurang','Sangat Baik'][ri(0,2)],Jenis:Math.random()<.1?'Komersial':'Residensial',X:rnd(a,c),Y:rnd(b,d)})}
    z23.push({type:'Feature',properties:{NILAI:Math.round(base*rnd(.7,.95)/1000)*1000,PENGGUNAAN:guna},geometry:sq(a+(c-a)*.08,b+hy*.05,c+(c-a)*.04,d)});
  }
  for(let k=0;k<5;k++){kecF.push({type:'Feature',properties:{WADMKC:kecs[k].toUpperCase()},geometry:sq(xs[k*2],y0,xs[k*2+2],y0+nrow*hy)})}
  for(let k=0;k<5;k++)for(let m=0;m<3;m++){desaF.push({type:'Feature',properties:{WADMKD:'Desa '+kecs[k].split(' ').pop()+' '+(m+1)},geometry:sq(xs[k*2],y0+m*3*hy,xs[k*2+2],y0+Math.min(nrow,(m+1)*3)*hy)})}
  const fc=a=>({type:'FeatureCollection',features:a});
  RAW={pts:null,zn:null};RAWGEO=null;Z23=null;
  ingest(fc(zRows.map((r,i)=>({type:'Feature',properties:r,geometry:zGeo[i]}))),'zona_contoh.zip');
  ingest(fc(pRows.map(r=>({type:'Feature',properties:r,geometry:null}))),'titik_contoh.dbf');
  setZ23(fc(z23));
  BAT={kec:fc(kecF),desa:fc(desaF)};
  AOI={awal:fc([{type:'Feature',properties:{},geometry:sq(xs[0],y0,xs[ncol],y0+nrow*hy)}]),baru:fc([{type:'Feature',properties:{},geometry:sq(xs[0]+.01,y0+.01,xs[ncol]-.01,y0+nrow*hy-.01)}])};
  DB.updated='DATA CONTOH (acak)';loadedInfo=['data contoh'];
  autoMap();remap();refresh();
}

/* ---------- pemeriksaan data dan pemetaan kolom ---------- */
function sampleOf(L,col){if(!L||!col)return '';for(const r of L.rows){const v=r[col];if(v!=null&&v!=='')return String(v).slice(0,26)}return ''}
function selFor(grp,k,L){const cur=MAP[grp][k]||'';return `<select data-mg="${grp}.${k}"><option value="">(tidak ada)</option>${L.fields.map(f=>`<option ${f===cur?'selected':''}>${esc(f)}</option>`).join('')}</select>`}
function diagCard(){
  if(!C.zones.length&&!C.points.length)return '';
  const d=C.diag,Mp=MAP.pt,Mz=MAP.zn,W=[],I=[];
  const pc=(a,b)=>b?a/b*100:0,zi=d.z||{},lu=d.luas||{};
  if(RAW.pts&&d.pts&&pc(d.matched,d.pts)<80)W.push(`Hanya ${fmt(d.matched)} dari ${fmt(d.pts)} titik (${fmt(pc(d.matched,d.pts))}%) terhubung ke zona. Cek kolom "Nomor zona" untuk titik di bawah, atau pilih "Dari lokasi (spasial)" pada Zona titik.`);
  if(RAW.pts&&!Mp.nilai)W.push('Kolom nilai tanah untuk titik tidak ditemukan. Pilih di bawah (Nilai tanah).');
  else if(RAW.pts&&d.pts&&pc(d.posN,d.pts)<50)W.push(`Kolom nilai tanah "${Mp.nilai}" bernilai 0 atau kosong pada ${fmt(100-pc(d.posN,d.pts))}% titik.`);
  if(RAW.pts&&!(d.pts&&C.points.some(p=>p.x&&p.y)))W.push('Titik tidak punya koordinat terbaca, jadi tidak tampil di peta. Pilih kolom X dan Y, atau muat titik sebagai .zip shapefile.');
  if(C.zones.length&&!GEO)W.push('Poligon zona belum dimuat, jadi peta zona dan luas dari poligon belum ada. Muat zona sebagai .zip shapefile.');
  if(lu.off)W.push(`Luas dari kolom "${lu.col}" berbeda dari luas poligon (rasio median ${fmt(lu.ratio,2)}). Luas yang dipakai: ${st.lsrc==='kolom'?'kolom':'poligon'}.`);
  if(d.nMis)W.push(`${fmt(d.nMis)} zona: jumlah titik pada ${Mz.n?'kolom "'+Mz.n+'"':'atribut zona'} berbeda dari jumlah titik sampel yang masuk zona. Statistik zona memakai ${st.ssrc==='titik'?'titik sampel':'kolom atribut zona'} (bisa diganti di bawah).`);
  if(d.kabIgnored)W.push('Filter kabupaten dilewati karena tidak ada baris yang cocok. Periksa kolom Kabupaten.');
  if(zi.tot)I.push(zi.mode==='spasial'?`Zona titik diambil dari <b>lokasi titik</b>: ${fmt(zi.spHit)} dari ${fmt(zi.tot)} titik berada di dalam poligon zona.`:`Zona titik diambil dari <b>kolom "${esc(Mp.zona||'-')}"</b>: ${fmt(pc(zi.hit,zi.tot))}% cocok dengan nomor zona.`);
  if(lu.geo)I.push(`Luas zona dari <b>${st.lsrc==='kolom'?'kolom '+esc(lu.col||'-'):'poligon'}</b>.${lu.unit&&lu.unit!=='m²'?' Kolom luas terbaca dalam '+esc(lu.unit)+'.':''}`);
  const zs=DB.zones.slice(0,4).map(z=>z.zona).join(', '),ps=DB.points.filter(p=>p.zKol).slice(0,4).map(p=>p.zKol).join(', ');
  if(zs||ps)I.push(`Contoh nomor zona, zona: <code>${esc(zs||'-')}</code> &middot; titik: <code>${esc(ps||'(kosong)')}</code>`);
  const open=st.mapOpen==null?W.length>0:st.mapOpen;
  const grid=(grp,L,keys)=>L?`<div class="mg">${keys.map(k=>`<label>${esc(SPEC[grp][k].l)}</label><div>${selFor(grp,k,L)}<div class="sub">contoh: ${esc(sampleOf(L,MAP[grp][k])||'-')}</div></div>`).join('')}</div>`:'<div class="sub" style="margin-top:6px">Belum dimuat.</div>';
  const opt=(v,t,cur)=>`<option value="${v}" ${cur===v?'selected':''}>${t}</option>`;
  return `<div class="card"><h2>Pemeriksaan data &amp; kolom</h2>
   ${W.map(t=>`<div class="row" style="margin-bottom:6px;align-items:flex-start;flex-wrap:nowrap"><span class="pill warn">!</span><span>${esc(t)}</span></div>`).join('')||'<div class="row" style="margin-bottom:6px"><span class="pill good">OK</span><span>Tidak ada masalah yang terdeteksi.</span></div>'}
   ${I.map(t=>`<div class="sub" style="margin-top:4px">${t}</div>`).join('')}
   <details id="mapd" ${open?'open':''}><summary>Pemetaan kolom dan sumber data</summary>
    <div class="sub" style="margin-top:6px">Kolom dideteksi otomatis. Ubah bila ada yang salah, lalu klik Terapkan.</div>
    <div class="mg"><label>Zona titik</label><select id="zsrc">${opt('auto','Otomatis',st.zsrc)}${opt('kolom','Dari kolom zona',st.zsrc)}${opt('spasial','Dari lokasi (spasial)',st.zsrc)}</select>
     <label>Sumber luas</label><select id="lsrc">${opt('geo','Dari poligon',st.lsrc)}${opt('kolom','Dari kolom luas',st.lsrc)}</select>
     <label>Statistik zona</label><select id="ssrc">${opt('kolom','Kolom atribut zona (Jml_Titik, RSD)',st.ssrc)}${opt('titik','Hitung dari titik sampel',st.ssrc)}</select></div>
    <h2 style="margin-top:12px">Kolom titik sampel</h2>${grid('pt',RAW.pts,['zona','nilai','svy','jenis','tp','tt','kec','desa','x','y','no','luasT','jalan','akses','jns'])}
    <h2 style="margin-top:12px">Kolom zona</h2>${grid('zn',RAW.zn,['zona','guna','luas','n','rsd','rata','svy'])}
    <div class="row" style="margin-top:10px"><button class="btn" id="mapok">Terapkan</button><button class="btn ghost" id="mapreset">Reset otomatis</button></div>
   </details></div>`;
}
function bindDiag(){
  const dd=$('#mapd');if(!dd)return;
  dd.addEventListener('toggle',()=>{st.mapOpen=dd.open});
  $('#mapok').onclick=()=>{
    const base=computeMap(false);
    document.querySelectorAll('[data-mg]').forEach(s=>{const [g,k]=s.dataset.mg.split('.');if(s.value!==(base[g][k]||''))OVR[g][k]=s.value;else delete OVR[g][k]});
    st.zsrc=$('#zsrc').value;st.lsrc=$('#lsrc').value;st.ssrc=$('#ssrc').value;saveOvr();
    autoMap();remap();refresh()};
  $('#mapreset').onclick=()=>{OVR={pt:{},zn:{}};st.zsrc='auto';st.lsrc='geo';st.ssrc='kolom';saveOvr();autoMap();remap();refresh()};
}

/* ---------- siklus muat ---------- */
function stampText(){const d=C.points.map(p=>p.tp).filter(Boolean).sort();return d.length||DB.updated?((d.length?`Pelaksanaan terakhir: ${d[d.length-1]}`:'')+(DB.updated?` · Data: ${DB.updated}`:'')):'Belum ada data dimuat'}
function refresh(){
  if(geoDirty){buildGeoIndex();C=compute();buildMapLayers();geoDirty=false}
  C=compute();$('#stamp').textContent=stampText();side();restyle();drawPts();legend();rekap();
}
window.__ZNT={CFG,SPEC,st,rekap,side,analisis,csvZona,csvTitik,setSvy:s=>{st.svy=s},setKec:k=>{st.kec=k},
  compute:()=>{C=compute();return C},ingest,autoMap,remap,refresh,buildGeoIndex,parseDBF,normDate,numv,zk,polysArea,pip,polysOf,bboxPolys,loadDemo,
  state:()=>({DB,GEO,Z23,BAT,AOI,ZK,RAW,RAWGEO,MAP,DIAG,OVR})};
setView('split');
initMap();
refresh();
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{restyle();legend();drawPts()});
})();
